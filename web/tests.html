  <script src="js/colours.js"></script>

  <script src="app.js"></script>
  <script>
    (function () {
      const core = window.HabitualCore;
      let total = 0, passed = 0, failed = 0;

      const container = document.getElementById('test-results-container');
      let currentSuiteEl = null;

      function runAllTests() {
        total = 0; passed = 0; failed = 0;
        container.innerHTML = '';

        describe('Feature 1: 📊 7x52 Heatmap Grid & Date Shading Logic', () => {
          test('formatDateKey formats Date object to YYYY-MM-DD string', () => {
            assertEqual(core.formatDateKey(new Date(2026, 0, 5)), '2026-01-05');
          });
          test('parseDateKey converts YYYY-MM-DD string back to Date', () => {
            const d = core.parseDateKey('2026-10-02');
            assertEqual(d.getFullYear(), 2026);
            assertEqual(d.getMonth(), 9);
            assertEqual(d.getDate(), 2);
          });
          test('parseFlexibleDate parses DD/MM/YYYY and YYYY-MM-DD formats', () => {
            assertEqual(core.parseFlexibleDate('15/08/2026'), '2026-08-15');
            assertEqual(core.parseFlexibleDate('2026-08-15'), '2026-08-15');
          });
          test('getDaysAgoKey returns accurate relative date strings', () => {
            const today = core.getTodayKey();
            assertEqual(core.getDaysAgoKey(0), today);
          });
          test('Heatmap Ratio Calculation scales continuous alpha', () => {
            const h = { id: 'h1', dailyTarget: 4, type: 'positive', colorTheme: 'green' };
            assertEqual(core.getHabitHexWithAlpha(h, 0.0), '#39d35300');
            assertEqual(core.getHabitHexWithAlpha(h, 0.25), '#39d35340');
            assertEqual(core.getHabitHexWithAlpha(h, 0.50), '#39d35380');
            assertEqual(core.getHabitHexWithAlpha(h, 0.75), '#39d353bf');
            assertEqual(core.getHabitHexWithAlpha(h, 1.0), '#39d353ff');
          });
        });

        describe('Feature 2: 🎯 Positive & Negative Habit Goal Types', () => {
          test('Positive Habit tracks build completion status', () => {
            const h = { id: 'c', type: 'positive', dailyTarget: 1, logs: { '2026-10-01': { count: 1 } } };
            assert(h.logs['2026-10-01'].count >= h.dailyTarget);
          });
          test('Negative (Quit) Habit calculates clean days automatically', () => {
            const today = new Date();
            const d2 = new Date(today); d2.setDate(d2.getDate() - 2);
            const quit = {
              id: 'caf', type: 'negative',
              logs: { [core.formatDateKey(d2)]: { count: 1 } }
            };
            assertEqual(core.calculateStreakForTarget(quit).current, 2);
          });
        });

        describe('Feature 3: 📅 Flexible Schedules & Target Frequencies', () => {
          test('Weekly Schedule logs count within week window', () => {
            const h = { id: 'w', frequencyType: 'weekly', weeklyTarget: 2, targetDays: [1], logs: { '2026-09-28': { count: 1 }, '2026-09-30': { count: 1 } } };
            assertEqual(core.getWeeklyLogCount(h, '2026-09-28', '2026-10-04'), 2);
          });
          test('Monthly Schedule logs count within month window', () => {
            const h = { id: 'm', frequencyType: 'monthly', monthlyTarget: 1, logs: { '2026-10-15': { count: 1 } } };
            assertEqual(core.getMonthlyLogCount(h, '2026-10-01', '2026-10-31'), 1);
          });
        });

        describe('Feature 4: 🌲 Hierarchical Sub-Habits & Dependency Rules', () => {
          test('Sub-habit tree structure tracks ancestry and descendants', () => {
            core.setState({
              habits: [
                { id: 'gym', parentId: null },
                { id: 'gym_legDay', parentId: 'gym' },
                { id: 'gym_legDay_squats', parentId: 'gym_legDay' }
              ]
            });
            const chain = core.getAncestryChain('gym_legDay_squats');
            assertEqual(chain[0].id, 'gym');
            assertEqual(chain[2].id, 'gym_legDay_squats');
          });
          test('Dependency Rule: requires_parent auto-logs parent task', () => {
            core.setState({
              habits: [
                { id: 'gym', dailyTarget: 1, logs: {} },
                { id: 'gym_leg', parentId: 'gym', parentDependency: 'requires_parent', dailyTarget: 1, logs: {} }
              ]
            });
            core.applyParentDependencyOnLog(core.getState().habits[1], '2026-10-02', 1);
            assertEqual(core.getState().habits[0].logs['2026-10-02'].count, 1);
          });
        });

        describe('Feature 5: 🎨 Color Themes & Custom HEX Color Picker', () => {
          test('Preset Themes and Custom HEX normalizer', () => {
            assertEqual(core.PRESET_THEME_HEX.green, '#39d353');
            assertEqual(core.normalizeHex('#f00'), '#ff0000');
          });
          test('getCustomThemeLevels generates 4 gradient levels', () => {
            const lvl = core.getCustomThemeLevels('#ff0000');
            assertEqual(lvl.level0, '#161b22');
            assertEqual(lvl.level4, '#ff0000');
          });
        });

        describe('Feature 6: ⏱️ Quick Logging & Day Notes', () => {
          test('toggleHabitForDate updates check-in count', () => {
            core.setState({ habits: [{ id: 'read', type: 'positive', logs: {} }] });
            core.toggleHabitForDate('read', '2026-10-02');
            assertEqual(core.getState().habits[0].logs['2026-10-02'].count, 1);
          });
        });

        describe('Feature 7: ⌛ Past History Backfilling', () => {
          test('generateBackfillLogs generates history logs over specified duration', () => {
            const res = core.generateBackfillLogs(30, 'daily', '1', 1, 'positive', 'daily', [1], '1', 1, 1);
            assertEqual(Object.keys(res.logs).length, 31);
          });
        });

        describe('Feature 8: 🔥 Streak & Year Analytics Engine', () => {
          test('calculateStreakForTarget calculates unbroken active streak', () => {
            const today = new Date();
            const k0 = core.formatDateKey(today);
            const d1 = new Date(today); d1.setDate(d1.getDate() - 1); const k1 = core.formatDateKey(d1);
            const h = { id: 'w', type: 'positive', dailyTarget: 1, logs: { [k0]: { count: 1 }, [k1]: { count: 1 } } };
            assertEqual(core.calculateStreakForTarget(h).current, 2);
          });
        });

        describe('Feature 9: 📥 CSV Data Import Engine', () => {
          test('parseCSVAndImport imports habits from CSV string', () => {
            const csv = 'Date,Coding,Days Since Alcohol\n01/10/2026,1,0';
            core.parseCSVAndImport(csv, 'Test');
            assertEqual(core.getState().habits.length, 2);
          });
        });

        describe('Feature 10: 💾 Data Backups & Privacy', () => {
          test('saveState and loadState persist data in local storage', () => {
            core.setState({ habits: [{ id: 'test', name: 'Test' }] });
            core.saveState();
            core.resetState();
            core.loadState();
            assertEqual(core.getState().habits[0].name, 'Test');
          });
        });

        describe('Feature 11: 📱 PWA & Navigation Support', () => {
          test('Service Worker and Manifest registered', () => {
            assert(window.navigator.serviceWorker !== undefined, 'Service worker available');
          });
          test('Logo header brand link points to home page index.html', () => {
            const headerBrand = document.querySelector('.header-brand');
            if (headerBrand) {
              assertEqual(headerBrand.getAttribute('href'), 'index.html', 'Header brand link targets home page index.html');
            }
          });
        });

        describe('Feature 12: 🔄 Multi-Target Sync & Storage Abstraction', () => {
          test('LocalStorageDriver and IndexedDBDriver interface compliance', () => {
            assert(core.LocalStorageDriver !== undefined, 'LocalStorageDriver exists');
            assert(core.IndexedDBDriver !== undefined, 'IndexedDBDriver exists');
            assertEqual(core.LocalStorageDriver.name, 'localStorage');
            assertEqual(core.IndexedDBDriver.name, 'indexedDB');
          });

          test('E2EE encrypt and decrypt maintains payload integrity', async () => {
            const samplePayload = { habits: [{ id: 'h1', name: 'Meditation' }] };
            const passphrase = 'secret_passphrase_123';
            const encrypted = await core.E2EE.encrypt(samplePayload, passphrase);
            assert(encrypted.startsWith('ENC:'), 'Ciphertext starts with ENC: prefix');
            const decrypted = await core.E2EE.decrypt(encrypted, passphrase);
            assertEqual(decrypted.habits[0].name, 'Meditation');
          });

          test('E2EE decrypt rejects with mismatched passphrase', async () => {
            const samplePayload = { habits: [{ id: 'h1', name: 'Meditation' }] };
            const encrypted = await core.E2EE.encrypt(samplePayload, 'passphrase_A');
            let errorCaught = false;
            try {
              await core.E2EE.decrypt(encrypted, 'wrong_passphrase_B');
            } catch (e) {
              errorCaught = true;
            }
            assert(errorCaught, 'Decryption rejected when passphrases do not match');
          });

          test('pullAndMergeAll reports failure when Firestore decryption fails', async () => {
            const samplePayload = { habits: [{ id: 'h1', name: 'Yoga' }] };
            const encrypted = await core.E2EE.encrypt(samplePayload, 'correct_pass');
            core.SyncManager.settings.passphrase = 'wrong_pass';
            core.SyncManager.toggleTarget('firestore', true);
            core.SyncTargets.Firestore.downloadBackup = () => Promise.resolve(encrypted);

            const result = await core.SyncManager.pullAndMergeAll();
            assertEqual(result.merged, false, 'Merge reported false on decrypt failure');
            assertEqual(result.error, 'DECRYPT_FAILED', 'Result error code is DECRYPT_FAILED');
            core.SyncManager.toggleTarget('firestore', false);
          });

          test('mergeStatePayloads deterministically merges overlapping habit logs', () => {
            const payloadA = {
              updatedAt: 1000,
              habits: [{ id: 'h1', name: 'Exercise', logs: { '2026-10-01': { count: 1 } } }]
            };
            const payloadB = {
              updatedAt: 2000,
              habits: [
                { id: 'h1', name: 'Exercise', logs: { '2026-10-01': { count: 2 }, '2026-10-02': { count: 1 } } },
                { id: 'h2', name: 'Reading', logs: { '2026-10-02': { count: 1 } } }
              ]
            };
            const merged = core.mergeStatePayloads(payloadA, payloadB);
            assertEqual(merged.habits.length, 2);
            const h1 = merged.habits.find(h => h.id === 'h1');
            assertEqual(h1.logs['2026-10-01'].count, 2);
            assertEqual(h1.logs['2026-10-02'].count, 1);
          });

          test('SyncManager target management', () => {
            core.SyncManager.toggleTarget('dropbox', true);
            assert(core.SyncManager.isTargetEnabled('dropbox'), 'Dropbox target enabled');
            core.SyncManager.toggleTarget('dropbox', false);
            assert(!core.SyncManager.isTargetEnabled('dropbox'), 'Dropbox target disabled');
          });

          describe('Feature 13: ⏳ Pre-logged Future Habit Verification & Future Events Clearing Engine', () => {
            test('Toggling or saving a future date sets unverified flag', () => {
              const todayStr = core.getTodayKey();
              const parts = todayStr.split('-');
              const futureDate = `${parseInt(parts[0], 10) + 1}-01-01`;
              const testHabit = { id: 'test_future_h', name: 'Future Meditation', logs: {} };
              core.state.habits = [testHabit];

              core.toggleHabitForDate('test_future_h', futureDate);
              assert(testHabit.logs[futureDate] !== undefined, 'Future log created');
              assertEqual(testHabit.logs[futureDate].unverified, true, 'Future log marked as unverified');
            });

            test('getUnverifiedLogs identifies pending verification logs when date arrives', () => {
              const todayStr = core.getTodayKey();
              const testHabit = {
                id: 'test_unverified_h',
                name: 'Upcoming Run',
                logs: {}
              };
              testHabit.logs[todayStr] = { count: 1, unverified: true };
              core.state.habits = [testHabit];

              const unverified = core.getUnverifiedLogs();
              assert(unverified.length > 0, 'Found unverified log for today');
              assertEqual(unverified[0].habitId, 'test_unverified_h');
            });

            test('verifyLog confirms pre-logged habit and removes unverified flag', () => {
              const todayStr = core.getTodayKey();
              const testHabit = {
                id: 'test_verify_h',
                name: 'Yoga',
                logs: {}
              };
              testHabit.logs[todayStr] = { count: 1, unverified: true };
              core.state.habits = [testHabit];

              core.verifyLog('test_verify_h', todayStr, true);
              assertEqual(testHabit.logs[todayStr].count, 1, 'Preserved completed count');
              assertEqual(testHabit.logs[todayStr].unverified, undefined, 'Removed unverified flag');
            });

            test('clearFutureLogsForHabit removes all logs with dateKey > todayStr', () => {
              const todayStr = core.getTodayKey();
              const parts = todayStr.split('-');
              const futureDate1 = `${parseInt(parts[0], 10) + 1}-05-10`;
              const futureDate2 = `${parseInt(parts[0], 10) + 1}-06-15`;
              const testHabit = {
                id: 'test_clear_future_h',
                name: 'Future Planning',
                logs: {}
              };
              testHabit.logs['2020-01-01'] = { count: 1 };
              testHabit.logs[futureDate1] = { count: 1, unverified: true };
              testHabit.logs[futureDate2] = { count: 1, unverified: true };
              core.state.habits = [testHabit];

              const cleared = core.clearFutureLogsForHabit('test_clear_future_h');
              assertEqual(cleared, 2, 'Cleared 2 future logs');
              assert(testHabit.logs[futureDate1] === undefined, 'Future log 1 removed');
              assert(testHabit.logs[futureDate2] === undefined, 'Future log 2 removed');
              assert(testHabit.logs['2020-01-01'] !== undefined, 'Past log preserved');
            });
          });
        });
      }

      function describe(name, fn) {
        const card = document.createElement('div');
        card.className = 'suite-card';
        card.innerHTML = `<div class="suite-header">${name}</div><ul class="test-list"></ul>`;
        container.appendChild(card);
        currentSuiteEl = card.querySelector('.test-list');
        fn();
      }

      function test(name, fn) {
        total++;
        const item = document.createElement('li');
        item.className = 'test-item';

        try {
          core.resetState();
          localStorage.clear();
          fn();
          passed++;
          item.classList.add('test-pass');
          item.innerHTML = `<span class="test-status">✅</span> <div><strong>PASS:</strong> ${name}</div>`;
        } catch (err) {
          failed++;
          item.classList.add('test-fail');
          item.innerHTML = `
            <span class="test-status">❌</span>
            <div>
              <strong>FAIL:</strong> ${name}
              <div class="test-error">${err.message}</div>
            </div>
          `;
        }

        currentSuiteEl.appendChild(item);
        updateStats();
      }

      function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
      function assertEqual(act, exp, msg) {
        if (act !== exp) throw new Error(`${msg || 'Expected match'}: Expected "${exp}", got "${act}"`);
      }

      function updateStats() {
        document.getElementById('stat-total').textContent = `Total: ${total}`;
        document.getElementById('stat-pass').textContent = `Passed: ${passed} ✅`;
        document.getElementById('stat-fail').textContent = `Failed: ${failed} ❌`;
      }

      // Initial run
      runAllTests();

      const btnRerun = document.getElementById('btn-rerun-tests');
      if (btnRerun) {
        btnRerun.addEventListener('click', runAllTests);
      }

    })();
  </script>
</body>
