<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habitual - Quick Add Widget</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body class="dark-theme">
  <div class="app-container">

    <!-- Widget App Header -->
    <header class="app-header">
      <a href="../index.html" class="header-brand" style="text-decoration: none;">
        <div class="logo-icon">
          <svg class="logo-svg" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="url(#logo-grad-add)"/>
            <path d="M9 16L14 21L23 11" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="logo-grad-add" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop stop-color="#39d353"/>
                <stop offset="1" stop-color="#0e4429"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Habitual</h1>
          <p class="tagline">⚡ Quick Add Widget</p>
        </div>
      </a>
      <div class="header-actions">
        <span id="widget-date-display" class="badge-count">Today</span>
        <a href="../index.html" class="btn btn-secondary btn-sm">Open App ↗</a>
      </div>
    </header>

    <!-- Main Widget Container -->
    <main class="widget-preview-card" style="max-width: 600px; margin: 0 auto; width: 100%;">
      <div class="widget-card-header">
        <div class="widget-card-title">
          <span class="widget-icon">⚡</span>
          <h3>Quick Habit Check-in</h3>
        </div>
        <span class="widget-type-badge">1-Click Logger</span>
      </div>
      <p class="widget-card-description">
        Instant 1-click check-ins for active daily habit goals without opening dialogs.
      </p>

      <div class="widget-card-body">
        <div class="widget-header-bar">
          <span class="widget-brand">⚡ Habitual Active Goals</span>
          <span id="quick-add-today-label" class="widget-date">Loading...</span>
        </div>

        <div id="widget-add-list" class="widget-quick-add-list">
          <!-- Populated dynamically by JS -->
          <div class="widget-empty-notice">Loading active habits...</div>
        </div>
      </div>

      <div class="widget-action-buttons">
        <button id="btn-refresh-add" class="btn btn-secondary btn-sm">🔄 Refresh List</button>
        <a href="settings.html" class="btn btn-secondary btn-sm">⚙️ Widget Settings</a>
      </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- App Footer -->
    <footer class="app-footer">
      <p>Habitual • Quick Add Widget Page</p>
    </footer>
  </div>

  <!-- Core Scripts -->
  <script src="../js/colours.js" defer></script>
  <script src="../js/state.js" defer></script>
  <script src="../js/storage.js" defer></script>
  <script src="../js/render.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/widgets.js" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.HabitualCore) {
        if (HabitualCore.loadState) HabitualCore.loadState();

        let draggedHabitId = null;

        function getFilterHabitId() {
          const hash = window.location.hash || '';
          if (hash.startsWith('#habit/')) {
            return decodeURIComponent(hash.replace('#habit/', '').trim());
          }
          return null;
        }

        function getDescendantIds(habitId) {
          const ids = [habitId];
          const habits = (HabitualCore.state && Array.isArray(HabitualCore.state.habits)) ? HabitualCore.state.habits : [];
          const children = habits.filter(h => h.parentId === habitId);
          children.forEach(c => ids.push(...getDescendantIds(c.id)));
          return ids;
        }

        function reorderHabitsInState(fromId, toId) {
          if (!HabitualCore.state || !Array.isArray(HabitualCore.state.habits)) return null;
          const habits = HabitualCore.state.habits;
          const fromIdx = habits.findIndex(h => h.id === fromId);
          const toIdx = habits.findIndex(h => h.id === toId);
          if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return null;

          const [moved] = habits.splice(fromIdx, 1);
          habits.splice(toIdx, 0, moved);
          if (HabitualCore.saveState) HabitualCore.saveState();
          return moved;
        }

        function moveHabitInState(habitId, direction) {
          if (!HabitualCore.state || !Array.isArray(HabitualCore.state.habits)) return;
          const habits = HabitualCore.state.habits;
          const fromIdx = habits.findIndex(h => h.id === habitId);
          if (fromIdx === -1) return;
          const toIdx = fromIdx + direction;
          if (toIdx < 0 || toIdx >= habits.length) return;

          const [moved] = habits.splice(fromIdx, 1);
          habits.splice(toIdx, 0, moved);
          if (HabitualCore.saveState) HabitualCore.saveState();
          if (HabitualCore.showToast) HabitualCore.showToast(`Reordered "${moved.name}"`);
          renderQuickAddWidget();
        }

        function renderQuickAddWidget() {
          const payload = HabitualCore.getQuickAddWidgetPayload ? HabitualCore.getQuickAddWidgetPayload() : null;
          const container = document.getElementById('widget-add-list');
          const dateLabel = document.getElementById('quick-add-today-label');
          const headerDate = document.getElementById('widget-date-display');

          if (payload && dateLabel) dateLabel.textContent = payload.dateStr;
          if (payload && headerDate) headerDate.textContent = payload.dateStr;

          if (!container || !payload) return;

          if (!payload.habits || payload.habits.length === 0) {
            container.innerHTML = `<div class="widget-empty-notice">No active habits found. Create a habit in Habitual to populate your widget!</div>`;
            return;
          }

          const filterHabitId = getFilterHabitId();
          let displayHabits = payload.habits;
          let filterHeaderHTML = '';

          if (filterHabitId) {
            const allowedIds = new Set(getDescendantIds(filterHabitId));
            displayHabits = payload.habits.filter(h => allowedIds.has(h.id));

            const targetHabit = (HabitualCore.state && Array.isArray(HabitualCore.state.habits))
              ? HabitualCore.state.habits.find(h => h.id === filterHabitId)
              : null;
            const filterName = targetHabit ? (HabitualCore.escapeHTML ? HabitualCore.escapeHTML(targetHabit.name) : targetHabit.name) : filterHabitId;

            filterHeaderHTML = `
              <div class="widget-filter-bar">
                <span>Viewing: <strong>${filterName}</strong> & sub-habits</span>
                <button id="btn-clear-widget-filter" class="btn btn-secondary btn-sm">⬅ Show All Habits</button>
              </div>
            `;
          }

          if (displayHabits.length === 0) {
            container.innerHTML = filterHeaderHTML + `<div class="widget-empty-notice">No matching sub-habits found for this filter. <a href="#">Clear filter</a></div>`;
            const btnClear = document.getElementById('btn-clear-widget-filter');
            if (btnClear) btnClear.onclick = () => { window.location.hash = ''; renderQuickAddWidget(); };
            return;
          }

          const cardsHTML = displayHabits.map(h => {
            const habitName = HabitualCore.escapeHTML ? HabitualCore.escapeHTML(h.name) : h.name;
            const habitColor = (HabitualCore.normalizeHex && h.color) ? HabitualCore.normalizeHex(h.color) : (h.color || '#39d353');
            const indentStyle = h.depth > 0 ? `margin-left: ${Math.min(h.depth, 3) * 24}px;` : '';
            const subIndicator = h.isSubhabit ? `<span class="subhabit-curve-icon" style="color: ${habitColor}; font-weight: bold; margin-right: 4px;">↳</span>` : '';

            return `
              <div class="widget-habit-card widget-habit-item draggable-card ${h.isSubhabit ? 'widget-subhabit-card' : ''}"
                   draggable="true"
                   data-habit-id="${h.id}"
                   style="${indentStyle}">
                <div class="widget-order-controls">
                  <span class="widget-drag-handle" title="Drag to reorder">⋮⋮</span>
                  <button class="btn-order-move btn-move-up" data-habit-id="${h.id}" title="Move Up">▲</button>
                  <button class="btn-order-move btn-move-down" data-habit-id="${h.id}" title="Move Down">▼</button>
                </div>
                <div class="widget-habit-left">
                  <div class="habit-color-tab" style="background-color: ${habitColor}1a; border-color: ${habitColor}4d;">
                    <span class="color-tab-pill" style="background-color: ${habitColor}; box-shadow: 0 0 6px ${habitColor};"></span>
                    <span class="tab-title">
                      ${subIndicator}<a href="#habit/${encodeURIComponent(h.id)}" class="card-title-link" title="Show ${habitName} & sub-habits in this view">${habitName}</a>
                    </span>
                  </div>
                  <div class="widget-habit-meta-row">
                    <span class="widget-meta-pill">🔥 ${h.streak} d streak</span>
                    <span class="widget-meta-pill ${h.isCompleted ? 'completed-pill' : ''}">
                      Today: ${h.completedCount}/${h.dailyTarget} ${h.isCompleted ? '✓' : ''}
                    </span>
                  </div>
                </div>
                <button class="widget-quick-log-btn ${h.isCompleted ? 'completed' : ''}"
                        style="${!h.isCompleted ? `border-color: ${habitColor}; color: ${habitColor};` : ''}"
                        data-habit-id="${h.id}"
                        title="${h.isCompleted ? 'Completed today!' : 'Click to quick log +1'}">
                  ${h.statusIcon}
                </button>
              </div>
            `;
          }).join('');

          container.innerHTML = filterHeaderHTML + cardsHTML;

          const btnClear = document.getElementById('btn-clear-widget-filter');
          if (btnClear) {
            btnClear.onclick = () => {
              window.location.hash = '';
              renderQuickAddWidget();
            };
          }

          // Attach move up / move down handlers
          container.querySelectorAll('.btn-move-up').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const id = btn.getAttribute('data-habit-id');
              if (id) moveHabitInState(id, -1);
            });
          });

          container.querySelectorAll('.btn-move-down').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const id = btn.getAttribute('data-habit-id');
              if (id) moveHabitInState(id, 1);
            });
          });

          // Attach HTML5 Drag & Drop reorder handlers
          container.querySelectorAll('.widget-habit-card').forEach(card => {
            card.addEventListener('dragstart', (e) => {
              draggedHabitId = card.getAttribute('data-habit-id');
              card.classList.add('dragging');
              if (e.dataTransfer) {
                e.dataTransfer.setData('text/plain', draggedHabitId || '');
                e.dataTransfer.effectAllowed = 'move';
              }
            });

            card.addEventListener('dragend', () => {
              card.classList.remove('dragging');
              container.querySelectorAll('.widget-habit-card').forEach(c => c.classList.remove('drag-over'));
            });

            card.addEventListener('dragover', (e) => {
              e.preventDefault();
              if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
              const targetId = card.getAttribute('data-habit-id');
              if (draggedHabitId && targetId && draggedHabitId !== targetId) {
                card.classList.add('drag-over');
              }
            });

            card.addEventListener('dragleave', () => {
              card.classList.remove('drag-over');
            });

            card.addEventListener('drop', (e) => {
              e.preventDefault();
              card.classList.remove('drag-over');
              const targetHabitId = card.getAttribute('data-habit-id');
              if (draggedHabitId && targetHabitId && draggedHabitId !== targetHabitId) {
                const moved = reorderHabitsInState(draggedHabitId, targetHabitId);
                if (moved && HabitualCore.showToast) {
                  HabitualCore.showToast(`Reordered "${moved.name}"`);
                }
                renderQuickAddWidget();
              }
            });
          });

          // Attach log click handlers
          container.querySelectorAll('.widget-quick-log-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const habitId = btn.getAttribute('data-habit-id');
              const todayKey = payload.dateKey;
              if (habitId && HabitualCore.toggleHabitForDate) {
                HabitualCore.toggleHabitForDate(habitId, todayKey);
                if (HabitualCore.showToast) HabitualCore.showToast('Logged progress via Quick Add Widget!');
                renderQuickAddWidget();
              }
            });
          });
        }

        window.addEventListener('hashchange', renderQuickAddWidget);
        renderQuickAddWidget();

        const btnRefresh = document.getElementById('btn-refresh-add');
        if (btnRefresh) {
          btnRefresh.addEventListener('click', () => {
            renderQuickAddWidget();
            if (HabitualCore.showToast) HabitualCore.showToast('Refreshed quick add widget habits!');
          });
        }
      }
    });
  </script>
</body>
</html>
