<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Today's To-Do List - Habitual</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="todo-app-container">
    <div class="todo-header">
      <a href="index.html" class="btn-back">← Home</a>
      <h1 style="margin:0; font-size: 1.3rem;">Today's To-Do List</h1>
      <div></div>
    </div>

    <!-- Countdown Timer Card -->
    <div class="todo-countdown-card">
      <div class="todo-countdown-title">Time Remaining Today</div>
      <div class="todo-countdown-timer" id="todo-countdown">--h --m --s</div>
      <div class="todo-countdown-subtext">Hours left to complete your remaining goals before midnight</div>
    </div>

    <!-- Task List Card -->
    <div class="todo-list-card">
      <div class="todo-list-header">
        <div class="todo-list-title">Today's Tasks</div>
        <div class="todo-progress-badge" id="todo-progress">0/0 Done</div>
      </div>
      <div class="todo-items-list" id="todo-items-container">
        <div class="todo-empty-state">Loading tasks...</div>
      </div>
    </div>
  </div>

  <script src="js/colours.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/widgets.js"></script>
  <script>
    (function() {
      const core = window.HabitualCore || {};

      function updateCountdown() {
        const timerEl = document.getElementById('todo-countdown');
        const subtextEl = document.querySelector('.todo-countdown-subtext');
        if (!timerEl) return;
        if (core.getTodayRemainingTime) {
          const info = core.getTodayRemainingTime();
          timerEl.textContent = info.formattedString;
          if (subtextEl && info.boundaryLabel) {
            subtextEl.textContent = `Hours left to complete your remaining goals ${info.boundaryLabel}`;
          }
        }
      }

      function renderTodoListUI() {
        const container = document.getElementById('todo-items-container');
        const progressEl = document.getElementById('todo-progress');
        const titleEl = document.querySelector('.todo-list-title');
        if (!container) return;

        if (!core.getTodoListData && !core.getTodayTodoList) {
          container.innerHTML = '<div class="todo-empty-state">Core widget helpers not loaded.</div>';
          return;
        }

        const todoData = core.getTodoListData ? core.getTodoListData() : { mode: 'today_uncompleted', items: core.getTodayTodoList().filter(item => !item.isCompleted) };
        const items = todoData.items || [];

        if (titleEl) {
          titleEl.textContent = "Uncompleted Tasks Today";
        }

        if (progressEl) {
          progressEl.textContent = `${items.length} Task${items.length === 1 ? '' : 's'} Remaining`;
        }

        if (items.length === 0) {
          container.innerHTML = '<div class="todo-empty-state">All tasks for today are complete!</div>';
          return;
        }

        container.innerHTML = '';
        items.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = `todo-item ${item.isCompleted ? 'completed' : ''}`;

          const instanceLabel = item.totalTarget > 1 ? ` (${item.instanceIndex}/${item.totalTarget})` : '';
          const subBadge = item.totalTarget > 1 ? `<div class="todo-target-badge">${item.instanceIndex} of ${item.totalTarget}</div>` : '';

          const noteText = item.note ? `<div style="font-size: 0.8rem; color: var(--text-dim, #8f9aa9); margin-top: 2px;">${core.escapeHTML ? core.escapeHTML(item.note) : item.note}</div>` : '';

          itemEl.innerHTML = `
            <div class="todo-item-left">
              <div class="todo-checkbox">${item.isCompleted ? '✓' : ''}</div>
              <div>
                <div class="todo-item-text">${core.escapeHTML ? core.escapeHTML(item.habitName) : item.habitName}${instanceLabel}</div>
                ${noteText}
              </div>
            </div>
            ${subBadge}
          `;

          itemEl.addEventListener('click', () => {
            if (core.toggleHabitForDate) {
              core.toggleHabitForDate(item.habitId, item.dateKey);
              renderTodoListUI();
            }
          });

          container.appendChild(itemEl);
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        if (core.loadState) {
          core.loadState();
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);
        renderTodoListUI();
      });
    })();
  </script>
</body>
</html>
